[project]
name = "invoice-reconciliation-engine"
version = "0.1.0"
description = "Extract invoice PDFs with Claude, reconcile them against purchase orders, route exceptions to human review"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9",
    "fastapi>=0.115",
    "fpdf2>=2.9.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
